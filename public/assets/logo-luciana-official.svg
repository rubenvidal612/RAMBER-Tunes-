<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="blueRingOuter" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="1"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="55%" stop-color="#0ea5e9" stop-opacity="1"/>
      <stop offset="80%" stop-color="#0369a1" stop-opacity="1"/>
      <stop offset="100%" stop-color="#082f49" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="blueRingInner" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="1"/>
      <stop offset="30%" stop-color="#7dd3fc" stop-opacity="1"/>
      <stop offset="60%" stop-color="#0ea5e9" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="goldDisc" cx="40%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="1"/>
      <stop offset="15%" stop-color="#fde68a" stop-opacity="1"/>
      <stop offset="35%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="1"/>
      <stop offset="85%" stop-color="#b45309" stop-opacity="1"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldTexture" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" stop-opacity="0.25"/>
      <stop offset="25%" stop-color="#fcd34d" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#92400e" stop-opacity="0.18"/>
      <stop offset="75%" stop-color="#fde047" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="silverL" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="1"/>
      <stop offset="20%" stop-color="#e2e8f0" stop-opacity="1"/>
      <stop offset="45%" stop-color="#cbd5e1" stop-opacity="1"/>
      <stop offset="65%" stop-color="#94a3b8" stop-opacity="1"/>
      <stop offset="85%" stop-color="#64748b" stop-opacity="1"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="silverHighlight" x1="15%" y1="5%" x2="45%" y2="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f1f5f9" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0"/>
    </linearGradient>
    <filter id="dropShadowL" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="6" dy="10" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="2" dy="4" stdDeviation="2" flood-color="#1e293b" flood-opacity="0.3"/>
    </filter>
    <filter id="glowBlue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="bevelEmboss" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="7" specularConstant="0.9" specularExponent="22" lighting-color="#ffffff" result="specOut">
        <fePointLight x="-3000" y="-4000" z="6000"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut2"/>
      <feComposite in="SourceGraphic" in2="specOut2" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
    <pattern id="goldBrush" patternUnits="userSpaceOnUse" width="120" height="120" patternTransform="rotate(35)">
      <rect width="120" height="120" fill="url(#goldTexture)"/>
      <line x1="0" y1="0" x2="120" y2="120" stroke="#fef08a" stroke-opacity="0.08" stroke-width="1"/>
      <line x1="30" y1="-10" x2="140" y2="100" stroke="#78350f" stroke-opacity="0.06" stroke-width="1"/>
      <line x1="-20" y1="40" x2="90" y2="150" stroke="#fde68a" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="innerDiscClip">
      <circle cx="512" cy="512" r="360"/>
    </clipPath>
  </defs>

  <circle cx="512" cy="512" r="472" fill="url(#blueRingOuter)" filter="url(#glowBlue)"/>
  <circle cx="512" cy="512" r="440" fill="url(#blueRingInner)"/>
  <circle cx="512" cy="512" r="420" fill="none" stroke="#e0f2fe" stroke-opacity="0.6" stroke-width="2"/>
  <circle cx="512" cy="512" r="408" fill="none" stroke="#082f49" stroke-opacity="0.5" stroke-width="1"/>

  <circle cx="512" cy="512" r="360" fill="url(#goldDisc)" filter="url(#bevelEmboss)"/>
  <circle cx="512" cy="512" r="360" fill="url(#goldBrush)" clip-path="url(#innerDiscClip)"/>
  <ellipse cx="430" cy="380" rx="180" ry="110" fill="#fef9c3" fill-opacity="0.22"/>
  <ellipse cx="460" cy="350" rx="90" ry="55" fill="#ffffff" fill-opacity="0.3"/>

  <g filter="url(#dropShadowL)">
    <g transform="translate(0,0)">
      <path
        d="M 360 290
           L 360 660
           Q 360 700 400 700
           L 664 700
           Q 704 700 704 660
           L 704 610
           Q 704 570 664 570
           L 470 570
           L 470 290
           Q 470 250 430 250
           Q 390 250 360 290 Z"
        fill="url(#silverL)"
        stroke="#1e293b"
        stroke-width="3"
        stroke-opacity="0.6"
        stroke-linejoin="round"
      />
      <path
        d="M 380 275
           L 380 650
           Q 380 680 410 680
           L 650 680
           Q 680 680 680 650
           L 680 620
           Q 680 590 650 590
           L 490 590
           L 490 275
           Q 490 260 455 260
           Q 415 260 380 275 Z"
        fill="url(#silverHighlight)"
        opacity="0.85"
      />
      <path
        d="M 360 290
           L 360 660
           Q 360 700 400 700
           L 664 700
           Q 704 700 704 660
           L 704 610
           Q 704 570 664 570
           L 470 570
           L 470 290
           Q 470 250 430 250
           Q 390 250 360 290 Z"
        fill="none"
        stroke="#0f172a"
        stroke-width="1.5"
        stroke-opacity="0.4"
        stroke-linejoin="round"
      />
    </g>
  </g>

  <circle cx="512" cy="512" r="472" fill="none" stroke="#7dd3fc" stroke-opacity="0.35" stroke-width="1"/>
</svg>
